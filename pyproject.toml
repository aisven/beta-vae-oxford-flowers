[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=80.9"]


[project]
name = "beta-vae-oxford-flowers"
dynamic = ["version"]
description = "A Variational Auto-encoder with beta parameter (beta-VAE) mapping the Oxford flower dataset to a latent space."
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["vae", "autoencoder", "deep-learning"]
license = {text = "MIT"}
authors = [
  {name = "Max Mustermann", email = "max.mustermann@somewhere.de"},
]
maintainers = [
  {name = "Max Mustermann", email = "max.mustermann@somewhere.de"},
]
requires-python = ">=3.11.11,<3.12.0"
dependencies = [
    "matplotlib==3.10.7",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "scipy==1.16.3",
]


[project.optional-dependencies]
dev = [
    "black==25.11.0",
    "ruff==0.14.5",
]
test = [
    "pytest==8.4.2",
    "pytest-order==1.3.0",
    "pytest-sugar==1.1.1",
    "pytest-cov==6.3.0",
]
notebook = [
    "nbqa==0.1.19",
    "notebook==7.5.0",
]


[project.urls]
Repository = "https://github.com/aisven/beta-vae-oxford-flowers"


[tool.setuptools]
packages = ["beta_vae_oxford_flowers"]


[tool.setuptools.dynamic]
version = {attr = "beta_vae_oxford_flowers.__version__"}


[tool.black]
line-length = 160
target-version = ['py311']
exclude = '\.ipynb$'


[tool.ruff]
line-length = 160
target-version = "py311"
exclude = ["*.ipynb"]
